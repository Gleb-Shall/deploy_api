# ============================================================
# Anti-scraping / anti-bot protection for automatoria.ru
# ============================================================

# ------ Bad Bot Detection ------
# Block known scraping tools, keep legitimate crawlers
map $http_user_agent $bad_bot {
    default                         0;

    # Scraping frameworks
    ~*scrapy                        1;
    ~*python-requests               1;
    ~*python-urllib                 1;
    ~*libwww-perl                   1;
    ~*mechanize                     1;
    ~*curl                          1;

    # Security scanners
    ~*nikto                         1;
    ~*masscan                       1;
    ~*nuclei                        1;
    ~*sqlmap                        1;
    ~*zgrab                         1;
    ~*nmap                          1;
    ~*(dirbuster|dirb|gobuster)     1;

    # Empty user agent — almost always a bot
    ""                              1;
}

# ------ Rate Limiting Zones ------
# Per-IP limits for deployed sites
limit_req_zone $binary_remote_addr zone=deploy_site:20m        rate=20r/s;
limit_req_zone $binary_remote_addr zone=deploy_site_strict:10m rate=5r/s;
# Strict zone for fingerprint key: max 1 req/10s per IP (burst 3 for multi-tab)
limit_req_zone $binary_remote_addr zone=fingerprint_key:10m    rate=6r/m;

# Suppress rate limit error logging for 429s (avoid log spam)
limit_req_status 429;
