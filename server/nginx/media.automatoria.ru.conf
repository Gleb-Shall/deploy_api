server {
    if ($host = media.automatoria.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name media.automatoria.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.automatoria.ru;

    # Публичная отдача файлов (media_api порт 5052)
    location /file/ {
        proxy_pass http://127.0.0.1:5052;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Upload / Delete (требуют X-API-Key)
    location /api/media/ {
        proxy_pass http://127.0.0.1:5052;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 60s;
    }

    # Health check
    location /health {
        proxy_pass http://127.0.0.1:5052;
        access_log off;
    }

    # Обратная совместимость: старые ссылки /picture/<id> -> /file/<id>
    location /picture/ {
        rewrite ^/picture/(.+)$ /file/$1 permanent;
    }

    # Скриншоты (screenshot_api порт 5051) — без изменений
    location /screenshots/ {
        if ($bad_bot) { return 403; }
        limit_req zone=deploy_site burst=50 nodelay;
        proxy_pass http://127.0.0.1:5051/screenshot/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    ssl_certificate /etc/letsencrypt/live/media.automatoria.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/media.automatoria.ru/privkey.pem; # managed by Certbot
}
