# media.automatoria.ru
# /file/ — публичный просмотр файлов
# /api/media/ — только через SSH-туннель (127.0.0.1:5052)

server {
    listen 80;
    listen [::]:80;
    server_name media.automatoria.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.automatoria.ru;

    ssl_certificate /etc/letsencrypt/live/media.automatoria.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.automatoria.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Публичная отдача файлов
    location /file/ {
        proxy_pass http://127.0.0.1:5052;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Всё остальное — закрыто
    location / {
        return 403;
    }
}
