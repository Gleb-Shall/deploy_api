# media.automatoria.ru — SSL сохранён, публичный доступ к API закрыт.
# Управление только через SSH-туннель (127.0.0.1:5052).

server {
    listen 80;
    listen [::]:80;
    server_name media.automatoria.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name media.automatoria.ru;

    ssl_certificate /etc/letsencrypt/live/media.automatoria.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/media.automatoria.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Всё закрыто — API доступна только через SSH-туннель
    location / {
        return 403;
    }
}
