name: Deploy to Deploy Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy deploy_api
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /opt/deploy_api

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Syncing server scripts..."
            cp -r server/scripts/* /opt/deploy_api/scripts/
            chmod +x /opt/deploy_api/scripts/*.sh 2>/dev/null || true
            chmod +x /opt/deploy_api/scripts/*.py 2>/dev/null || true
            chmod +x /opt/deploy_api/scripts/*.js 2>/dev/null || true

            echo "==> Ensuring tinyproxy is installed and running on port 8888..."
            if ! systemctl is-active --quiet tinyproxy; then
              apt-get install -y tinyproxy
              printf '[Unit]\nDescription=TinyProxy HTTP proxy\nAfter=network.target\n\n[Service]\nType=simple\nExecStart=/usr/bin/tinyproxy -d -c /etc/tinyproxy/tinyproxy.conf\n\n[Install]\nWantedBy=multi-user.target\n' > /etc/systemd/system/tinyproxy.service
              systemctl daemon-reload
            fi
            printf 'User tinyproxy\nGroup tinyproxy\nPort 8888\nListen 127.0.0.1\nTimeout 600\nDefaultErrorFile "/usr/share/tinyproxy/default.html"\nLogFile "/var/log/tinyproxy/tinyproxy.log"\nLogLevel Info\nMaxClients 100\nAllow 127.0.0.1\n' > /etc/tinyproxy/tinyproxy.conf
            systemctl enable tinyproxy
            systemctl restart tinyproxy
            sleep 2
            curl -sf --proxy http://127.0.0.1:8888 --max-time 5 http://example.com -o /dev/null || echo "tinyproxy warning: proxy test failed"

            echo "==> Ensuring docker buildx is installed..."
            if ! docker buildx version >/dev/null 2>&1; then
              ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
              BUILDX_VERSION=$(curl -s https://api.github.com/repos/docker/buildx/releases/latest | grep tag_name | cut -d'"' -f4)
              mkdir -p /usr/lib/docker/cli-plugins
              curl -sL "https://github.com/docker/buildx/releases/download/${BUILDX_VERSION}/buildx-${BUILDX_VERSION}.linux-${ARCH}" \
                -o /usr/lib/docker/cli-plugins/docker-buildx
              chmod +x /usr/lib/docker/cli-plugins/docker-buildx
              echo "buildx installed: $(docker buildx version)"
            fi

            echo "==> Restarting API services..."
            systemctl restart domain_api screenshot_api media_api

            echo "==> Health checks..."
            sleep 3
            curl -sf http://127.0.0.1:5052/health || (echo "media_api health check failed" && exit 1)
            curl -sf http://127.0.0.1:5051/health || (echo "screenshot_api health check failed" && exit 1)
            curl -sf http://127.0.0.1:5000/health || (echo "domain_api health check failed" && exit 1)

            echo "==> All services healthy!"

  deploy-media:
    name: Deploy Media Server
    runs-on: ubuntu-latest
    needs: deploy

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_SERVER_IP }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e

            cd /opt/deploy_api

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "==> Updating nginx config..."
            cp server/nginx/media_api.conf /etc/nginx/sites-available/media_api
            nginx -t
            systemctl reload nginx

            echo "==> Health checks..."
            sleep 2
            curl -sf http://127.0.0.1:5051/health || (echo "screenshot_api health check failed" && exit 1)
            curl -sf http://127.0.0.1:5052/health || (echo "media_api health check failed" && exit 1)

            echo "==> Media server healthy!"
