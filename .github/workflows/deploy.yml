name: Build and Deploy API

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase image name
        id: image_name
        run: |
          IMAGE_NAME_LOWER=$(echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_NAME_LOWER=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image_name.outputs.IMAGE_NAME_LOWER }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            
            # Преобразуем имя образа в lowercase с полным путем
            IMAGE_NAME_LOWER="${{ env.REGISTRY }}/$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')"
            
            # Создаем необходимые директории
            mkdir -p /root/deploy_api/containers
            
            # Останавливаем старый контейнер если существует
            docker stop deploy-api 2>/dev/null || true
            docker rm deploy-api 2>/dev/null || true
            
            # Логинимся в GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            
            # Скачиваем новый образ
            docker pull ${IMAGE_NAME_LOWER}:latest || true
            
            # Если образ не скачался, используем latest тег из основного ветки
            IMAGE_TAG="latest"
            if ! docker pull ${IMAGE_NAME_LOWER}:latest 2>/dev/null; then
              IMAGE_TAG="${{ github.ref_name }}-${{ github.sha }}"
              docker pull ${IMAGE_NAME_LOWER}:${IMAGE_TAG} || true
            fi
            
            # Запускаем новый контейнер
            docker run -d \
              --name deploy-api \
              --restart unless-stopped \
              -p 8000:8000 \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v /root/deploy_api/containers:/app/containers \
              -e DOMAIN=${{ secrets.DOMAIN }} \
              -e SSH_HOST=${{ secrets.SSH_HOST }} \
              -e SSH_USER=${{ secrets.SSH_USER }} \
              -e RUN_ON_SERVER=1 \
              ${IMAGE_NAME_LOWER}:${IMAGE_TAG}
            
            # Очищаем старые образы
            docker image prune -f

